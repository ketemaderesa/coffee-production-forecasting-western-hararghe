name: coffee-yield
channels:
  - conda-forge
  - defaults
dependencies:
  # Python version
  - python=3.9

  # Core scientific computing
  - numpy>=1.21.0
  - pandas>=1.3.0
  - scipy>=1.7.0

  # Machine learning
  - scikit-learn>=1.0.0
  - xgboost>=1.5.0

  # Visualization
  - matplotlib>=3.5.0
  - seaborn>=0.11.0

  # Jupyter
  - jupyter>=1.0.0
  - notebook>=6.4.0
  - ipykernel>=6.0.0

  # Utilities
  - joblib>=1.1.0
  - tqdm>=4.62.0

  # Pip dependencies (not available in conda)
  - pip
  - pip:
    - xgboost>=1.5.0
